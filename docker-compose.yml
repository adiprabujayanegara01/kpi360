services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kpi360
      POSTGRES_USER: kpi360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpi360}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi360"]
      interval: 5s
      retries: 10
  web:
    build: .
    depends_on:
      db: {condition: service_healthy}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://kpi360:${POSTGRES_PASSWORD:-kpi360}@db:5432/kpi360
      SEED_DEMO: ${SEED_DEMO:-1}
    ports: ["8000:8000"]
    volumes: [appdata:/srv/kpi360/instance]
volumes:
  pgdata:
  appdata:
