{% extends "base.html" %}
{% block public %}
<div class="login-form" style="min-height:100vh">
  <form method="post" class="w-100" style="max-width:380px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2 class="h4">Lupa password</h2>
    <p class="text-secondary">Masukkan username atau email. Permintaan diteruskan ke HR untuk mengatur ulang password Anda.</p>
    <div class="mb-3"><label class="form-label" for="i">Username atau email</label><input id="i" name="identifier" class="form-control" required></div>
    <button class="btn btn-primary w-100">Kirim permintaan</button>
    <p class="mt-3 small"><a href="{{ url_for('auth.login') }}">Kembali ke halaman masuk</a></p>
  </form>
</div>
{% endblock %}
